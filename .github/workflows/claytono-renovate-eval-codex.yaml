---
# Compatibility wrapper for callers of the former Codex-only workflow name. It
# runs claytono-renovate-eval.yaml with provider: codex, so existing callers
# keep evaluating with Codex until they switch to the provider-neutral workflow
# and pass CLAUDE_CODE_OAUTH_TOKEN. Remove once no callers use it.
name: Claytono Renovate PR Evaluation (Codex)
on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to evaluate, or 'all' for all unevaluated PRs
        required: true
        type: string
      trigger:
        description: "'auto' for PR events, 'manual' for dispatch/schedule calls"
        required: false
        type: string
        default: manual
      dry_run:
        description: Evaluate but do not post or label
        required: false
        type: boolean
        default: false
      codex_runner_label:
        description: Runner label for the Codex evaluation job
        required: false
        type: string
        default: codex
      codex_reasoning_effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: ''
      codex_agent_timeout:
        description: Codex agent subprocess timeout in seconds; 0 disables it
        required: false
        type: string
        default: '0'
      evaluation_timeout_minutes:
        description: Maximum duration of the evaluation job in minutes
        required: false
        type: number
        default: 90
      ci_timeout:
        description: CI wait timeout passed to renovate-eval
        required: false
        type: string
        default: '1800'
      wait_timeout_seconds:
        description: Pre-evaluation GitHub Actions wait timeout in seconds
        required: false
        type: string
        default: '3600'
      max_automatic_evaluations:
        description: >-
          Maximum automatic evaluations per PR as a non-negative integer; 0 is
          unlimited
        required: false
        type: number
        default: 0
      fingerprint_ttl_seconds:
        description: >-
          Non-negative integer seconds before an unchanged fingerprint is
          evaluated again
        required: false
        type: number
        default: 604800
      setup_nix:
        description: Install Nix before evaluation
        required: false
        type: boolean
        default: true
      setup_cachix:
        description: Configure Cachix before evaluation
        required: false
        type: boolean
        default: true
      cachix_name:
        description: Cachix cache name
        required: false
        type: string
        default: claytono
    secrets:
      cachix_auth_token:
        description: Cachix auth token
        required: false
jobs:
  renovate-eval:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    # Tracks main like the evaluation action checkout in the called workflow.
    uses: claytono/github-actions/.github/workflows/claytono-renovate-eval.yaml@main  # zizmor: ignore[unpinned-uses]
    with:
      pr_number: ${{ inputs.pr_number }}
      trigger: ${{ inputs.trigger }}
      dry_run: ${{ inputs.dry_run }}
      provider: codex
      codex_runner_label: ${{ inputs.codex_runner_label }}
      codex_reasoning_effort: ${{ inputs.codex_reasoning_effort }}
      agent_timeout: ${{ inputs.codex_agent_timeout }}
      evaluation_timeout_minutes: ${{ inputs.evaluation_timeout_minutes }}
      ci_timeout: ${{ inputs.ci_timeout }}
      wait_timeout_seconds: ${{ inputs.wait_timeout_seconds }}
      max_automatic_evaluations: ${{ inputs.max_automatic_evaluations }}
      fingerprint_ttl_seconds: ${{ inputs.fingerprint_ttl_seconds }}
      setup_nix: ${{ inputs.setup_nix }}
      setup_cachix: ${{ inputs.setup_cachix }}
      cachix_name: ${{ inputs.cachix_name }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.cachix_auth_token }}
