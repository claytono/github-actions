---
name: Renovate PR Evaluation
# workflow_run only starts a pass; the pass selects Renovate-authored PRs from
# the inventory and never acts on the PR that triggered it. PRs from non-owners
# do not run CI without approval, so they cannot fire this trigger on their own.
on:  # zizmor: ignore[dangerous-triggers]
  # Hourly pass, off the top of the hour to avoid scheduler load.
  schedule:
    - cron: 23 * * * *
  # A Renovate branch finished CI, so its PR may now be ready to evaluate.
  workflow_run:
    workflows:
      - Lint
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate now; empty runs a normal pass
        required: false
        type: string
        default: ''
      batch_size:
        description: Maximum PRs evaluated in this pass; 0 only repairs labels
        required: false
        # A string, so an explicit 0 survives the `||` default below.
        type: string
        default: '6'
      usage_threshold:
        description: Claude used fraction (0-1] at which evaluation stops
        required: false
        type: string
        default: '0.8'
      continuation:
        description: Set by a pass that starts the next one; leave unset
        required: false
        type: boolean
        default: false
      dry_run:
        description: Evaluate but do not post or label
        required: false
        type: boolean
        default: false
      provider:
        description: Provider override, 'claude' or 'codex'; empty uses RENOVATE_EVAL_PROVIDER
        required: false
        type: string
        default: ''
      codex_runner_label:
        description: Runner label for Codex evaluation
        required: false
        type: string
        default: codex
      codex_reasoning_effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: ''
      agent_timeout:
        description: Agent subprocess timeout in seconds; 0 disables it
        required: false
        type: string
        default: '0'
jobs:
  renovate-eval:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    permissions:
      # write lets a pass start the next one when PRs are left over.
      actions: write
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    uses: ./.github/workflows/claytono-renovate-eval.yaml
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      batch_size: ${{ fromJSON(inputs.batch_size || '6') }}
      # Manual dispatch cannot disable the usage gate; empty means the default.
      usage_threshold: ${{ inputs.usage_threshold || '0.8' }}
      # Test this repository's own helpers, so a branch run exercises its code.
      helpers_ref: ${{ github.sha }}
      continuation: ${{ inputs.continuation || false }}
      dry_run: ${{ inputs.dry_run || false }}
      provider: ${{ inputs.provider }}
      codex_runner_label: ${{ inputs.codex_runner_label || 'codex' }}
      codex_reasoning_effort: ${{ inputs.codex_reasoning_effort }}
      agent_timeout: ${{ inputs.agent_timeout || '0' }}
      setup_cachix: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
