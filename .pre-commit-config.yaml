---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
        args:
          - -c
          - .yamlfix.toml
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or:
          - json
          - markdown
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args:
          - -i
          - '2'
          - -ci
          - -w
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor
        args:
          - --config=.zizmor.yml
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.111.2
    hooks:
      - id: renovate-config-validator
  - repo: local
    hooks:
      - id: control-tests
        name: control script tests
        entry: tests/control-tests.sh
        language: script
        pass_filenames: false
      - id: prepare-tests
        name: prepare script tests
        entry: tests/prepare-tests.sh
        language: script
        pass_filenames: false
      - id: renovate-eval-tests
        name: renovate-eval pytest + coverage
        entry: bash -c 'cd renovate-eval && uv run pytest tests/ --cov --cov-report=term-missing -q'
        language: system
        files: ^renovate-eval/
        pass_filenames: false
