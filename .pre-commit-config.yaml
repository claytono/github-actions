---
# nodeenv's default "latest" can resolve to a Node pre-release it can't
# install, and CI would otherwise use the runner's Node instead.
default_language_version:
  node: lts
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args:
          - --enforce-all
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
        args:
          - -c
          - .yamlfix.toml
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --list-different --ignore-unknown
        language: node
        additional_dependencies:
          - prettier@3.9.10
        types:
          - text
        types_or:
          - json
          - markdown
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args:
          - -i
          - '2'
          - -ci
          - -w
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --config
          - renovate-eval/pyproject.toml
        types_or:
          - python
          - pyi
      - id: ruff-format
        args:
          - --config
          - renovate-eval/pyproject.toml
        types_or:
          - python
          - pyi
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor
        args:
          - --config=.zizmor.yml
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.111.2
    hooks:
      - id: renovate-config-validator
  - repo: local
    hooks:
      - id: control-tests
        name: control script tests
        entry: tests/control-tests.sh
        language: script
        pass_filenames: false
      - id: prepare-tests
        name: prepare script tests
        entry: tests/prepare-tests.sh
        language: script
        pass_filenames: false
      - id: renovate-eval-tests
        name: renovate-eval pytest + coverage
        entry: bash -c 'cd renovate-eval && uv run pytest tests/ --cov --cov-report=term-missing -q'
        language: system
        files: ^renovate-eval/
        pass_filenames: false
