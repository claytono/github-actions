---
# Account-specific reusable workflow for claytono repositories to evaluate
# Renovate PRs with Claude or Codex.
#
# Callers normally pass no provider or model settings. The caller repository's
# configuration variables choose them, so switching providers or models needs
# no caller workflow change:
# - RENOVATE_EVAL_PROVIDER: 'claude' or 'codex'; unset means claude.
# - RENOVATE_EVAL_EVALUATOR_MODEL / RENOVATE_EVAL_AUDITOR_MODEL: Claude models;
#   unset means opus / sonnet.
# - RENOVATE_EVAL_CODEX_EVALUATOR_MODEL / RENOVATE_EVAL_CODEX_AUDITOR_MODEL /
#   RENOVATE_EVAL_CODEX_REASONING_EFFORT: Codex settings; unset means the Codex
#   defaults.
#
# Caller assumptions:
# - The caller repository is in the claytono account.
# - Callers pass CACHIX_AUTH_TOKEN and CLAUDE_CODE_OAUTH_TOKEN explicitly
#   rather than secrets: inherit, so this workflow tracking main can only
#   reach the credentials it needs. Codex needs no secret, so switching
#   providers or models still needs no caller change.
# - provider claude runs on claude_runner_label, default: ubuntu-latest, and
#   needs the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret.
# - provider codex runs on a self-hosted runner label that provides Codex
#   subscription auth, default: codex.
# - Renovate PRs are authored by the Renovate GitHub app/bot.
# - Repository context may be provided in the root .renovate-eval.md file.
# - Cachix is optional but expects CACHIX_AUTH_TOKEN when setup_cachix is true.
# - To let a pass continue with leftover PRs, the caller workflow defines
#   workflow_dispatch with a boolean continuation input that it forwards to
#   this workflow, and grants actions: write; continuation dispatches it.
#
# Evaluation runs as passes rather than per-PR events. Each pass lists the
# open Renovate PRs, repairs labels whose trusted sentinel already matches the
# current diff, and evaluates a shuffled batch of PRs whose evaluation is
# missing, stale, or mismatched and whose required checks have finished. At
# most max_parallel evaluations run at once, passes queue instead of cancelling
# each other, and a running evaluation is never cancelled. Before each
# evaluation, a Claude usage probe stops the pass when either the 5-hour or the
# weekly subscription window is at or above usage_threshold.
#
# Caller example:
#
# on:
#   schedule:
#     - cron: '23 * * * *'
#   workflow_dispatch:
#     inputs:
#       pr_number:
#         description: PR number to evaluate now; empty runs a normal pass
#         required: false
#         type: string
#       continuation:
#         description: Set by a pass that starts the next one; leave unset
#         required: false
#         type: boolean
#         default: false
# jobs:
#   renovate-eval:
#     permissions:
#       actions: write  # lets a pass start the next one for leftover PRs
#       contents: read
#       pull-requests: write
#       issues: write
#       checks: read
#       statuses: read
#     uses: claytono/github-actions/.github/workflows/claytono-renovate-eval.yaml@main  # zizmor: ignore[unpinned-uses]
#     with:
#       pr_number: ${{ inputs.pr_number || '' }}
#       continuation: ${{ inputs.continuation || false }}
#     secrets:
#       CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
#       CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
name: Claytono Renovate PR Evaluation
on:
  workflow_call:
    inputs:
      pr_number:
        description: >-
          PR number to evaluate now regardless of its evaluation state; empty or
          'all' runs a normal pass
        required: false
        type: string
        default: ''
      trigger:
        description: >-
          Deprecated; for callers that still run per PR event. 'auto' with a
          pr_number evaluates that PR only if it needs evaluation, waiting for
          its CI. Pass callers omit it
        required: false
        type: string
        default: ''
      batch_size:
        description: Maximum PRs evaluated in one pass
        required: false
        type: number
        default: 6
      max_parallel:
        description: Maximum evaluations running at once
        required: false
        type: number
        default: 2
      usage_threshold:
        description: >-
          Claude subscription used fraction (0-1] at which evaluations stop, in
          either the 5-hour or the weekly window; empty disables the check
        required: false
        type: string
        default: '0.8'
      helpers_ref:
        description: >-
          claytono/github-actions ref for the evaluation helpers and action;
          this repository's own caller passes its commit so branches test
          their own code
        required: false
        type: string
        default: main
      continuation:
        description: >-
          Set only by a pass that starts the next one; callers forward their
          own continuation dispatch input here
        required: false
        type: boolean
        default: false
      dry_run:
        description: Evaluate but do not post or label
        required: false
        type: boolean
        default: false
      provider:
        description: >-
          Evaluation agent provider, 'claude' or 'codex'; empty uses the
          RENOVATE_EVAL_PROVIDER variable, then claude
        required: false
        type: string
        default: ''
      claude_runner_label:
        description: Runner label for the Claude evaluation job
        required: false
        type: string
        default: ubuntu-latest
      codex_runner_label:
        description: Runner label for the Codex evaluation job
        required: false
        type: string
        default: codex
      codex_reasoning_effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: ''
      agent_timeout:
        description: Agent subprocess timeout in seconds; 0 disables it
        required: false
        type: string
        default: '0'
      evaluation_timeout_minutes:
        description: Maximum duration of the evaluation job in minutes
        required: false
        type: number
        default: 90
      ci_timeout:
        description: CI wait timeout passed to renovate-eval
        required: false
        type: string
        default: '1800'
      fingerprint_ttl_seconds:
        description: >-
          Non-negative integer seconds before an unchanged fingerprint is
          evaluated again
        required: false
        type: number
        default: 604800
      setup_nix:
        description: Install Nix before evaluation
        required: false
        type: boolean
        default: true
      setup_cachix:
        description: Configure Cachix before evaluation
        required: false
        type: boolean
        default: true
      cachix_name:
        description: Cachix cache name
        required: false
        type: string
        default: claytono
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix auth token
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token for provider claude
        required: false
      ANTHROPIC_API_KEY:
        description: Anthropic API key for provider claude
        required: false
# One pass at a time per repository. A newer pass waits; it never cancels a
# running evaluation. GitHub keeps one waiting run per group and a newer one
# replaces it, which is right for passes because the survivor re-plans. A
# request for one PR gets its own group so a pass cannot replace it, and manual
# and per-PR event requests use separate groups so an event cannot replace a
# waiting manual request.
concurrency:
  group: >-
    claytono-renovate-eval-${{ github.repository }}${{
    inputs.pr_number != '' && inputs.pr_number != 'all' &&
    format('-{0}-{1}', inputs.trigger == 'auto' && 'pr' || 'manual',
    inputs.pr_number) || '' }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      statuses: read
    outputs:
      should_evaluate: ${{ steps.usage.outputs.allowed == 'false' && 'false' || steps.plan.outputs.should_evaluate }}
      matrix: ${{ steps.plan.outputs.matrix }}
      manual: ${{ steps.plan.outputs.manual }}
      legacy: ${{ steps.plan.outputs.legacy }}
      deferred: ${{ steps.plan.outputs.deferred }}
      provider: ${{ steps.provider.outputs.provider }}
    steps:
      - name: Resolve provider
        id: provider
        env:
          INPUT_PROVIDER: ${{ inputs.provider }}
          VAR_PROVIDER: ${{ vars.RENOVATE_EVAL_PROVIDER }}
        run: |
          set -euo pipefail
          provider="${INPUT_PROVIDER:-${VAR_PROVIDER:-claude}}"
          case "$provider" in
            claude|codex) ;;
            *)
              echo "Unsupported renovate-eval provider: $provider" >&2
              exit 1
              ;;
          esac
          echo "Renovate eval provider: $provider"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
      - name: Checkout workflow helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          repository: claytono/github-actions
          ref: ${{ inputs.helpers_ref }}
          path: .github-actions
          persist-credentials: false
      - name: Plan evaluation pass
        id: plan
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_BATCH_SIZE: ${{ inputs.batch_size }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FINGERPRINT_TTL_SECONDS: ${{ inputs.fingerprint_ttl_seconds }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TRIGGER: ${{ inputs.trigger }}
        run: |
          set -euo pipefail
          args=(
            dispatch
            --batch-size "$INPUT_BATCH_SIZE"
            --evaluation-max-age-seconds "$INPUT_FINGERPRINT_TTL_SECONDS"
          )
          case "$INPUT_TRIGGER" in
            ''|auto|manual) ;;
            *)
              echo "trigger must be 'auto', 'manual', or empty, got: $INPUT_TRIGGER" >&2
              exit 1
              ;;
          esac
          manual=false
          legacy=false
          case "$INPUT_PR_NUMBER" in
            ''|all) ;;
            *[!0-9]*)
              echo "pr_number must be a PR number, 'all', or empty, got: $INPUT_PR_NUMBER" >&2
              exit 1
              ;;
            *)
              args+=(--pr "$INPUT_PR_NUMBER")
              if [[ "$INPUT_TRIGGER" == "auto" ]]; then
                # A per-PR event caller: evaluate only if needed, even while
                # CI runs, because no later trigger would catch this PR.
                args+=(--recheck --allow-pending-checks)
                legacy=true
              else
                manual=true
              fi
              ;;
          esac
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          echo "manual=$manual" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          python3 .github-actions/renovate-eval/renovate_eval.py "${args[@]}"
      - name: Setup Node
        if: >-
          steps.plan.outputs.should_evaluate == 'true' &&
          steps.provider.outputs.provider == 'claude' &&
          inputs.usage_threshold != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
      - name: Check Claude usage
        id: usage
        if: >-
          steps.plan.outputs.should_evaluate == 'true' &&
          steps.provider.outputs.provider == 'claude' &&
          inputs.usage_threshold != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          INPUT_USAGE_THRESHOLD: ${{ inputs.usage_threshold }}
        run: |
          set -euo pipefail
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN; subscription usage check does not apply"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code
          eval_cli=.github-actions/renovate-eval/renovate_eval.py
          rc=0
          python3 "$eval_cli" usage-check --threshold "$INPUT_USAGE_THRESHOLD" || rc=$?
          case "$rc" in
            0) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "::notice::Skipping this pass: Claude usage gate is closed"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::usage-check failed with exit code $rc"
              exit "$rc"
              ;;
          esac
  evaluate-pr:
    name: 'Evaluate PR #${{ matrix.pr_number }}'
    needs: gate
    if: needs.gate.outputs.should_evaluate == 'true'
    runs-on: ${{ needs.gate.outputs.provider == 'codex' && inputs.codex_runner_label || inputs.claude_runner_label }}
    timeout-minutes: ${{ inputs.evaluation_timeout_minutes }}
    # Serialize evaluations of one PR across passes, manual requests, and
    # per-PR events, which use different run-level groups. A running
    # evaluation is never cancelled.
    concurrency:
      group: claytono-renovate-eval-${{ github.repository }}-eval-${{ matrix.pr_number }}
      cancel-in-progress: false
    strategy:
      # A failed evaluation must not cancel the others.
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJson(needs.gate.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      # The PR checkout below replaces the workspace, so the recheck uses its
      # own helper checkout before it.
      - name: Checkout recheck helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          repository: claytono/github-actions
          ref: ${{ inputs.helpers_ref }}
          path: .github-actions
          persist-credentials: false
      # Reads the PR's current head for the checkout. A pass also confirms the
      # PR still needs evaluation; a manual request evaluates regardless.
      - name: Confirm evaluation is still needed
        id: recheck
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FINGERPRINT_TTL_SECONDS: ${{ inputs.fingerprint_ttl_seconds }}
          INPUT_LEGACY: ${{ needs.gate.outputs.legacy }}
          INPUT_MANUAL: ${{ needs.gate.outputs.manual }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          args=(
            dispatch
            --pr "$PR_NUMBER"
            --evaluation-max-age-seconds "$INPUT_FINGERPRINT_TTL_SECONDS"
          )
          if [[ "$INPUT_MANUAL" != "true" ]]; then
            args+=(--recheck)
          fi
          if [[ "$INPUT_LEGACY" == "true" ]]; then
            args+=(--allow-pending-checks)
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 .github-actions/renovate-eval/renovate_eval.py "${args[@]}"
      - name: Checkout
        if: steps.recheck.outputs.should_evaluate != 'false'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false
          ref: ${{ steps.recheck.outputs.head_sha || matrix.head_sha }}
          fetch-depth: 0
      - name: Checkout evaluation action
        if: steps.recheck.outputs.should_evaluate != 'false'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          repository: claytono/github-actions
          ref: ${{ inputs.helpers_ref }}
          path: .github-actions
          persist-credentials: false
      - name: Install Nix
        if: inputs.setup_nix && steps.recheck.outputs.should_evaluate != 'false'
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Setup Cachix
        if: inputs.setup_nix && inputs.setup_cachix && steps.recheck.outputs.should_evaluate != 'false'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: ${{ inputs.cachix_name }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Setup Nix environment
        if: inputs.setup_nix && steps.recheck.outputs.should_evaluate != 'false'
        run: |
          set -euo pipefail
          before_env=$(mktemp)
          after_env=$(mktemp)
          env -0 > "$before_env"
          nix develop --command env -0 > "$after_env"
          python3 - "$before_env" "$after_env" "$GITHUB_ENV" <<'PY'
          import pathlib
          import re
          import sys
          import uuid
          def read_env(path):
              values = {}
              for entry in pathlib.Path(path).read_bytes().split(b"\0"):
                  if not entry or b"=" not in entry:
                      continue
                  key, value = entry.split(b"=", 1)
                  values[key.decode()] = value.decode(errors="surrogateescape")
              return values
          name_re = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")
          blocked_names = {
              "ACTIONS_RUNTIME_TOKEN",
              "CI",
              "GITHUB_ENV",
              "GITHUB_PATH",
              "GITHUB_TOKEN",
              "HOME",
              "OLDPWD",
              "PWD",
              "RUNNER_TEMP",
              "RUNNER_TOOL_CACHE",
              "SHELL",
              "SHLVL",
              "_",
          }
          blocked_prefixes = ("ACTIONS_", "GITHUB_", "RUNNER_")
          before = read_env(sys.argv[1])
          after = read_env(sys.argv[2])
          github_env = pathlib.Path(sys.argv[3])
          with github_env.open("a", encoding="utf-8") as output:
              for name in sorted(after):
                  if before.get(name) == after[name]:
                      continue
                  if name in blocked_names or name.startswith(blocked_prefixes):
                      continue
                  if not name_re.fullmatch(name):
                      continue
                  delimiter = f"nix_env_{uuid.uuid4().hex}"
                  output.write(f"{name}<<{delimiter}\n")
                  output.write(after[name])
                  output.write(f"\n{delimiter}\n")
          PY
      - name: Set Codex home
        if: needs.gate.outputs.provider == 'codex' && steps.recheck.outputs.should_evaluate != 'false'
        run: |
          CODEX_HOME="${HOME}/.codex"
          mkdir -p "$CODEX_HOME"
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
      - name: Evaluate
        if: steps.recheck.outputs.should_evaluate != 'false'
        uses: ./.github-actions/renovate-eval
        env:
          # The evaluator fingerprints the diff it evaluates, which can be newer
          # than the one seen when the pass was planned.
          EVAL_TRIGGER: ${{ needs.gate.outputs.manual == 'true' && 'manual' || 'auto' }}
          RENOVATE_EVAL_EVALUATOR_MODEL: ${{ vars.RENOVATE_EVAL_EVALUATOR_MODEL }}
          RENOVATE_EVAL_AUDITOR_MODEL: ${{ vars.RENOVATE_EVAL_AUDITOR_MODEL }}
          RENOVATE_EVAL_CODEX_EVALUATOR_MODEL: ${{ vars.RENOVATE_EVAL_CODEX_EVALUATOR_MODEL }}
          RENOVATE_EVAL_CODEX_AUDITOR_MODEL: ${{ vars.RENOVATE_EVAL_CODEX_AUDITOR_MODEL }}
          RENOVATE_EVAL_CODEX_REASONING_EFFORT: ${{ vars.RENOVATE_EVAL_CODEX_REASONING_EFFORT }}
        with:
          pr_number: ${{ matrix.pr_number }}
          mode: ${{ inputs.dry_run && 'dry-run' || 'post' }}
          context: ci
          provider: ${{ needs.gate.outputs.provider }}
          codex_reasoning_effort: ${{ inputs.codex_reasoning_effort }}
          agent_timeout: ${{ inputs.agent_timeout }}
          ci_timeout: ${{ inputs.ci_timeout }}
          # Passes only select PRs whose required checks finished; manual and
          # per-PR event requests may arrive earlier, so they wait for CI.
          wait_for_ci: >-
            ${{ needs.gate.outputs.manual == 'true' ||
            needs.gate.outputs.legacy == 'true' }}
          usage_threshold: ${{ inputs.usage_threshold }}
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
  # Passes otherwise run only on triggers, so a backlog left when CI goes quiet
  # would wait for the next scheduled pass. When every evaluation in this pass
  # succeeded and the plan deferred PRs, start the next pass now. It waits in
  # the concurrency group until this run finishes, re-plans, and re-checks
  # usage, so the chain ends when nothing is deferred, the gate closes, or an
  # evaluation fails. The next pass is dispatched with only continuation=true,
  # so it runs with the caller's defaults; only passes known to use those
  # defaults continue: scheduled and workflow_run passes, and continuations,
  # which carry the explicit marker. A pass a person starts by hand, possibly
  # with overrides, does not continue unless they set the marker themselves.
  continue-pass:
    needs:
      - gate
      - evaluate-pr
    if: >-
      always() &&
      needs.gate.outputs.should_evaluate == 'true' &&
      needs.evaluate-pr.result == 'success' &&
      needs.gate.outputs.deferred != '0' &&
      needs.gate.outputs.manual != 'true' &&
      needs.gate.outputs.legacy != 'true' &&
      !inputs.dry_run &&
      (github.event_name != 'workflow_dispatch' || inputs.continuation)
    runs-on: ubuntu-latest
    # No permissions block: the job inherits the caller's token. Requesting
    # actions: write here would make GitHub reject every caller that grants
    # only actions: read, before any job ran. Callers that want continuation
    # grant actions: write; without it the dispatch fails visibly.
    steps:
      - name: Start the next pass
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DEFERRED: ${{ needs.gate.outputs.deferred }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |-
          set -euo pipefail
          # workflow_ref is owner/repo/.github/workflows/<file>@<ref> for the
          # calling workflow.
          # Cut at "@refs/", not the last "@", which a branch name may contain.
          workflow_file=${WORKFLOW_REF%%@refs/*}
          workflow_file=${workflow_file##*/}
          echo "$DEFERRED PR(s) deferred; starting the next pass of $workflow_file"
          gh workflow run "$workflow_file" --ref "$REF_NAME" -f continuation=true
